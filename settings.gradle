pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        // Xposed API (compileOnly) — LSPosed provides the real classes at runtime.
        maven { url 'https://api.xposed.info/' }
    }
}

rootProject.name = "CloX"
include ':app'
// Compile-only stubs for hidden framework classes (Path A remote-animation plumbing).
// Never packaged; the real framework classes shadow these at runtime (parent-first).
include ':frameworkstubs'

// Include Axmol Android Java library (AxmolGLSurfaceView, AxmolActivity, etc.)
// Only when the submodule is present.
def libaxmolDir = new File("${settingsDir}/axmol/core/platform/android/libaxmol")
if (libaxmolDir.exists()) {
    System.setProperty("AX_ROOT", new File("${settingsDir}/axmol").absolutePath)
    include ':libaxmol'
    project(':libaxmol').projectDir = libaxmolDir
}
