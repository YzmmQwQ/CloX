plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def axmolPresent = new File("${projectDir}/../axmol/CMakeLists.txt").exists()

android {
    namespace 'com.ailife.clox'
    compileSdk 36
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "com.ailife.clox"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        ndk { abiFilters 'arm64-v8a' }

        externalNativeBuild {
            cmake {
                cppFlags "-frtti -fexceptions -fsigned-char -std=c++17"
                if (axmolPresent) {
                    def axmolRoot = new File("${projectDir}/../axmol").absolutePath
                    arguments "-DAX_ENABLE_EXT_LUA=ON",
                              "-DAX_ENABLE_PHYSICS=OFF",
                              "-DAX_BUILD_TESTS=OFF",
                              "-DAX_ENABLE_EXT_SPINE=OFF",
                              "-DAX_ENABLE_EXT_DRAGONBONES=OFF",
                              "-DAX_ENABLE_EXT_COCOSTUDIO=OFF",
                              "-DAXSLCC_FIND_PROG_ROOT=${axmolRoot}/tools/external/axslcc/bin"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "../CMakeLists.txt"
            version "3.31.4"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    aaptOptions {
        noCompress 'mp3', 'ogg', 'wav', 'mp4', 'ttf', 'ttc', 'lua'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.dynamicanimation:dynamicanimation-ktx:1.0.0-alpha03'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    if (axmolPresent) {
        implementation project(':libaxmol')
    }

    testImplementation 'junit:junit:4.13.2'
}

