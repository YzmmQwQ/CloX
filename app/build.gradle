plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def axmolPresent = new File("${projectDir}/../axmol/CMakeLists.txt").exists()

// Fixed release signing key. CI writes keystore/keystore.properties from
// repository secrets (Settings → Secrets and variables → Actions); local
// builds can use the same file. Without it, release falls back to the debug
// key so plain local builds still work.
def keystorePropsFile = rootProject.file("keystore/keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKey = keystorePropsFile.exists() &&
    keystoreProps['storeFile'] &&
    rootProject.file(keystoreProps['storeFile']).exists()

if (axmolPresent) {
    // Copy Axmol Lua framework scripts → assets/axmol/
    def axmolScriptSrc = new File("${projectDir}/../axmol/extensions/scripting/lua-bindings/script")
    def axmolScriptDst = new File("${projectDir}/src/main/assets/axmol")
    task copyAxmolLua(type: Copy) {
        from axmolScriptSrc
        into axmolScriptDst
    }

    // The old post-build Copy task that moved axslcc's output into
    // src/main/assets/axslc ran at preBuild — BEFORE the native build generated
    // the files — so clean builds (CI) packaged no shaders at all:
    // ProgramManager failed every builtin shader load, LayerColor's create()
    // asserted, and watchface.lua onEnter aborted mid-way leaving a black
    // screen. build/runtime is now an asset root instead (see sourceSets).
    preBuild.dependsOn copyAxmolLua
}

android {
    namespace 'com.yzmm.clox'
    compileSdk 37
    ndkVersion "25.2.9519653"

    // axslcc writes compiled shaders to build/runtime/axslc during the native
    // build; exposing build/runtime as an asset root packages that tree as
    // assets/axslc/, where ProgramManager looks them up at runtime.
    sourceSets {
        main {
            assets.srcDir "${buildDir}/runtime"
        }
    }

    defaultConfig {
        applicationId "com.yzmm.clox"
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName "6.3"

        // Debug bundles every ABI Axmol ships prebuilt 3rdparty libs for, so the
        // emulator works. Release ships ARM only — x86/x86_64 exist only for the
        // emulator and doubled the release APK (119 MB → ~56 MB). Decided from the
        // requested tasks because AGP UNIONS buildType abiFilters with defaultConfig
        // (a buildType override cannot narrow the set).
        if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        } else {
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
        }

        externalNativeBuild {
            cmake {
                cppFlags "-frtti -fexceptions -fsigned-char -std=c++20"
                if (axmolPresent) {
                    arguments "-DAX_ENABLE_EXT_LUA=ON",
                              "-DAX_BUILD_TESTS=OFF",
                              "-DAX_ENABLE_EXT_IMGUI=OFF"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "../CMakeLists.txt"
            version "3.31.4"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


    buildFeatures {
        viewBinding true
        buildConfig true
        aidl true
        compose true
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Stable key so builds from different machines/CI runs update in
            // place; fall back to debug only when no release key is configured.
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    aaptOptions {
        noCompress 'mp3', 'ogg', 'wav', 'mp4', 'ttf', 'ttc', 'lua'
    }
}

// The shader tree only exists once the native build has run. Wire
// native build -> merge assets so a clean (CI) build never packages an APK
// without assets/axslc (see the sourceSets comment above).
if (axmolPresent) {
    project.afterEvaluate {
        ['Debug', 'Release'].each { variantName ->
            def mergeTask  = tasks.findByName("merge${variantName}Assets")
            def nativeTask = tasks.findByName("externalNativeBuild${variantName}")
            if (mergeTask != null && nativeTask != null) {
                mergeTask.dependsOn(nativeTask)
            }
        }
    }
}

dependencies {
    // Jetpack Compose + Wear Material 3. Wear Compose 1.6.2 (the version
    // Horologist is built against) targets Compose 1.9 and minCompileSdk 35,
    // so the 2025.09.00 BOM keeps us on compileSdk 36.
    def composeBom = platform('androidx.compose:compose-bom:2025.09.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.wear.compose:compose-foundation:1.6.2'
    implementation 'androidx.wear.compose:compose-material3:1.6.2'
    implementation 'androidx.wear.compose:compose-navigation:1.6.2'
    implementation 'com.materialkolor:material-color-utilities:5.0.1'
    implementation 'androidx.navigation:navigation-compose:2.6.0'
    implementation 'androidx.activity:activity-compose:1.13.0'

    // Hidden-framework stubs for Path A remote animations — compile-time only, never packaged.
    compileOnly project(':frameworkstubs')
    // Xposed/LSPosed API — compileOnly; the real classes are injected by LSPosed into the
    // hooked process (system_server) at runtime. Used to grant CloX READ_FRAME_BUFFER so
    // getTaskSnapshot works for the real-window close morph (see xposed/PermGrantHook).
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.github.Dimezis:BlurView:version-3.2.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.dynamicanimation:dynamicanimation-ktx:1.0.0-alpha03'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    // ViewPager2
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    // Shizuku
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    // Root via libsu
    implementation 'com.github.topjohnwu.libsu:core:6.0.0'
    implementation 'com.github.topjohnwu.libsu:service:6.0.0'
    // NanoHTTPD for remote management web server
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // ZXing QR code generation (core only — no Android wrapper needed)
    implementation 'com.google.zxing:core:3.5.4'

    if (axmolPresent) {
        implementation project(':libaxmol')
    }

    testImplementation 'junit:junit:4.13.2'
}

