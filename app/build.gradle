plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def axmolPresent = new File("${projectDir}/../axmol/CMakeLists.txt").exists()

if (axmolPresent) {
    // Copy Axmol Lua framework scripts → assets/axmol/
    def axmolScriptSrc = new File("${projectDir}/../axmol/extensions/scripting/lua-bindings/script")
    def axmolScriptDst = new File("${projectDir}/src/main/assets/axmol")
    task copyAxmolLua(type: Copy) {
        from axmolScriptSrc
        into axmolScriptDst
    }

    // Copy compiled axslc shaders → assets/axslc/ (built by CMake/axslcc during native build)
    def axslcSrc = new File("${projectDir}/build/runtime/axslc")
    def axslcDst = new File("${projectDir}/src/main/assets/axslc")
    task copyAxslcShaders(type: Copy) {
        from axslcSrc
        into axslcDst
    }
    preBuild.dependsOn copyAxmolLua
    preBuild.dependsOn copyAxslcShaders
}

android {
    namespace 'com.ailife.clox'
    compileSdk 36
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "com.ailife.clox"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        ndk { abiFilters 'arm64-v8a' }

        externalNativeBuild {
            cmake {
                cppFlags "-frtti -fexceptions -fsigned-char -std=c++20"
                if (axmolPresent) {
                    arguments "-DAX_ENABLE_EXT_LUA=ON",
                              "-DAX_BUILD_TESTS=OFF",
                              "-DAX_ENABLE_EXT_IMGUI=OFF"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "../CMakeLists.txt"
            version "3.31.4"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        viewBinding true
        buildConfig true
        aidl true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    aaptOptions {
        noCompress 'mp3', 'ogg', 'wav', 'mp4', 'ttf', 'ttc', 'lua'
    }
}

dependencies {
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.github.Dimezis:BlurView:version-2.0.6'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.dynamicanimation:dynamicanimation-ktx:1.0.0-alpha03'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // ViewPager2
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    // Shizuku
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    // Root via libsu
    implementation 'com.github.topjohnwu.libsu:core:5.2.2'
    implementation 'com.github.topjohnwu.libsu:service:5.2.2'
    // NanoHTTPD for remote management web server
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // ZXing QR code generation (core only — no Android wrapper needed)
    implementation 'com.google.zxing:core:3.5.3'

    if (axmolPresent) {
        implementation project(':libaxmol')
    }

    testImplementation 'junit:junit:4.13.2'
}

